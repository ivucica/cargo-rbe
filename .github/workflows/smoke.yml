name: smoke

# Server-agnostic. Nothing here names a particular REAPI service.
#
# Repository *variables* (Settings > Secrets and variables > Actions > Variables). The "remote"
# job runs only when RBE_REMOTE_EXECUTOR is set; everything else is optional:
#   RBE_REMOTE_EXECUTOR   e.g. grpcs://rbe.example.com
#   RBE_REMOTE_CACHE      defaults to the executor if empty
#   RBE_INSTANCE_NAME     REAPI instance name, may be empty
#   RBE_EXEC_PROPERTIES   one key=value per line (platform properties; names defined by your server)
#   RBE_BES_BACKEND       Build Event Stream endpoint; set it to get an invocation page on servers
#                         that build one from events (usually the same host as the executor)
#   RBE_BUILD_METADATA    one KEY=VALUE per line, published in the BuildMetadata event
#   RBE_RESULTS_URL       template, e.g. https://ui.example.com/invocation/{invocation_id}
#   RBE_RUN_BUILD_SCRIPT_TEST  set to 'true' to run the build-script test on your executor (its image needs gcc and the same Rust toolchain)
#   RBE_RUN_WRAPPER_TEST  set to 'true' to also run the wrapper acceptance test against the cache
# Repository *secret*:
#   RBE_HEADERS           one or more "name=value" lines sent as gRPC metadata (any header names);
#                         applied to cache, execution and BES

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "Reuse a nonce to test cache hits across runs (optional)"
        required: false
      project_repo:
        description: "Also run the wrapper on a real project against the configured remote: git URL (optional)"
        required: false
      project_ref:
        description: "Tag or branch of that project (default 15.2.0, for ripgrep)"
        required: false
        default: "15.2.0"
      project_build_scripts:
        description: "Build scripts for the project run: off | cache | remote (remote uses the configured executor)"
        required: false
        default: "off"
      project_cargo_args:
        description: "cargo arguments for the project run"
        required: false
        default: "build"
  pull_request:
    paths: ["src/**", "Cargo.*", ".github/workflows/smoke.yml", "protos/**", "scripts/**", "examples/**"]

permissions:
  contents: read

env:
  # Pinned so cache keys describe their contents. 1.85 is what Debian trixie ships, and the
  # crate dependencies must keep building on it (rust-version in Cargo.toml). Bump deliberately.
  RUST_VERSION: "1.85"
  BAZEL_REMOTE_VERSION: "2.6.4"
  LBB_VERSION: "v2.325.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain cache. actions/cache never overwrites an existing key, so the key must describe
      # the contents exactly: hence the pinned version above instead of a floating "stable".
      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo --version

      # Dependency and build cache. Saved at job end (post step), only if the job succeeds, so
      # target/ includes this build. The key changes with Cargo.lock; the restore-keys prefix
      # gives a partial hit after a dependency bump. Source-only changes reuse the exact entry
      # (first write wins), which still saves the dependency builds, the expensive part.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target
          key: cargo-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-rbe
          path: |
            target/release/cargo-rbe
            target/release/cargo-rbe-wrap

  local-cache-only:
    # No secrets, no cloud account: runs the cache/ByteStream/ActionCache steps against a local
    # cache-only REAPI server (bazel-remote). Execution is reported as skipped.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cargo-rbe }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-remote
          key: bazel-remote-${{ env.BAZEL_REMOTE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Start local cache-only server
        run: |
          case "$(uname -m)" in x86_64) A=amd64 ;; aarch64) A=arm64 ;; *) echo "unsupported arch"; exit 1 ;; esac
          mkdir -p ~/.cache/bazel-remote
          BR=~/.cache/bazel-remote/bazel-remote
          if [ ! -x "$BR" ]; then
            curl -fsSL -o "$BR" "https://github.com/buchgr/bazel-remote/releases/download/v${BAZEL_REMOTE_VERSION}/bazel-remote-${BAZEL_REMOTE_VERSION}-linux-${A}"
          fi
          chmod +x "$BR" cargo-rbe cargo-rbe-wrap
          mkdir -p /tmp/brdata
          nohup "$BR" --dir /tmp/brdata --max_size 2 --grpc_address 127.0.0.1:9092 --http_address 127.0.0.1:8080 > br.log 2>&1 &
          sleep 3
      - name: Smoke
        run: ./cargo-rbe smoke --remote_cache=grpc://127.0.0.1:9092 --json-out report.json | tee smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report-local-cache-only, path: "report.json\nsmoke.log" }

  wrapper-cache-test:
    # D2 acceptance test against a local cache-only server (no secrets): Action digests are stable
    # across checkouts, units published from one checkout are restored in another.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cargo-rbe, path: bin }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-remote
          key: bazel-remote-${{ env.BAZEL_REMOTE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Start local cache-only server
        run: |
          case "$(uname -m)" in x86_64) A=amd64 ;; aarch64) A=arm64 ;; *) echo "unsupported arch"; exit 1 ;; esac
          mkdir -p ~/.cache/bazel-remote
          BR=~/.cache/bazel-remote/bazel-remote
          if [ ! -x "$BR" ]; then
            curl -fsSL -o "$BR" "https://github.com/buchgr/bazel-remote/releases/download/v${BAZEL_REMOTE_VERSION}/bazel-remote-${BAZEL_REMOTE_VERSION}-linux-${A}"
          fi
          chmod +x "$BR" bin/cargo-rbe bin/cargo-rbe-wrap
          mkdir -p /tmp/brdata
          nohup "$BR" --dir /tmp/brdata --max_size 2 --grpc_address 127.0.0.1:9092 --http_address 127.0.0.1:8080 > br.log 2>&1 &
          sleep 3
      - name: Wrapper acceptance test
        run: |
          BIN_DIR="$PWD/bin" scripts/two-checkout-test.sh --remote-cache grpc://127.0.0.1:9092 | tee wrapper-test.log
          { echo "### wrapper acceptance test (local cache-only server)"; echo '```'; grep -E '^(==|PASS|FAIL|  [AB] |  edited)' wrapper-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build-script acceptance test (cache mode)
        run: BIN_DIR="$PWD/bin" scripts/build-script-test.sh --mode cache --remote-cache grpc://127.0.0.1:9092 | tee build-script-test.log
      - name: Wrapper acceptance test, target directories outside the checkouts
        run: EXTERNAL_TARGET=1 BIN_DIR="$PWD/bin" scripts/two-checkout-test.sh --remote-cache grpc://127.0.0.1:9092 | tee wrapper-test-external-target.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: wrapper-test-local-cache-only, path: "wrapper-test.log\nwrapper-test-external-target.log\nbuild-script-test.log" }

  local-buildbuddy:
    # Full stack without secrets or cloud accounts: BuildBuddy server + executor + Redis, run
    # directly on the runner (see scripts/local-buildbuddy.sh). Exercises execution and BES.
    needs: build
    runs-on: ubuntu-latest
    env:
      LBB_REDIS_PORT: "6380"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cargo-rbe }
      - name: Install Redis (binary only; the packaged service is not used)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server && (sudo systemctl stop redis-server || true)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/local-buildbuddy/bin
          key: local-buildbuddy-${{ env.LBB_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Start local BuildBuddy
        run: scripts/local-buildbuddy.sh start
      - name: Smoke (cache + execution + build events)
        run: |
          chmod +x cargo-rbe cargo-rbe-wrap
          ./cargo-rbe smoke --remote_executor=grpc://127.0.0.1:1985 --bes_backend=grpc://127.0.0.1:1985 \
            --remote_timeout=120s --build_metadata=VISIBILITY=PUBLIC \
            --results_url='http://localhost:8080/invocation/{invocation_id}' --json-out report.json | tee smoke.log
          { echo "### cargo-rbe smoke (local BuildBuddy $LBB_VERSION)"; echo '```'; grep -E '^(invocation_id|results_url|\[|summary)' smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Wrapper acceptance test against the local BuildBuddy cache
        run: |
          BIN_DIR="$PWD" scripts/two-checkout-test.sh --remote-cache grpc://127.0.0.1:1985 | tee wrapper-test.log
          { echo "### wrapper acceptance test (local BuildBuddy $LBB_VERSION)"; echo '```'; grep -E '^(==|PASS|FAIL|  [AB] |  edited)' wrapper-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build-script acceptance test, remote execution on the local executor
        run: |
          BIN_DIR="$PWD" scripts/build-script-test.sh --mode remote --remote-executor grpc://127.0.0.1:1985 | tee build-script-test-remote.log
          BIN_DIR="$PWD" scripts/build-script-test.sh --mode cache --remote-cache grpc://127.0.0.1:1985 | tee build-script-test-cache.log
          { echo "### build-script acceptance tests (local BuildBuddy $LBB_VERSION)"; echo '```'; grep -hE '^(==|PASS|FAIL|  [ABC]:|    )' build-script-test-remote.log build-script-test-cache.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Server and executor logs (on failure)
        if: failure()
        run: scripts/local-buildbuddy.sh logs
      - name: Stop
        if: always()
        run: scripts/local-buildbuddy.sh stop
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report-local-buildbuddy, path: "report.json\nsmoke.log\nwrapper-test.log\nbuild-script-test-remote.log\nbuild-script-test-cache.log" }

  remote:
    needs: build
    # Skip when not configured, and for forked PRs (which cannot read secrets).
    if: >-
      vars.RBE_REMOTE_EXECUTOR != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      RBE_HEADERS: ${{ secrets.RBE_HEADERS }}
      RBE_EXEC_PROPERTIES: ${{ vars.RBE_EXEC_PROPERTIES }}
      RBE_BUILD_METADATA: ${{ vars.RBE_BUILD_METADATA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cargo-rbe }
      - name: Smoke against the configured remote
        run: |
          chmod +x cargo-rbe cargo-rbe-wrap
          args=(--remote_executor="${{ vars.RBE_REMOTE_EXECUTOR }}")
          args+=(--remote_cache="${{ vars.RBE_REMOTE_CACHE || vars.RBE_REMOTE_EXECUTOR }}")
          args+=(--remote_instance_name="${{ vars.RBE_INSTANCE_NAME }}")
          args+=(--results_url="${{ vars.RBE_RESULTS_URL }}")
          args+=(--bes_backend="${{ vars.RBE_BES_BACKEND }}")
          [ -n "$RBE_HEADERS" ] && args+=(--remote_header=@env:RBE_HEADERS)
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--remote_default_exec_properties="$line")
          done <<< "$RBE_EXEC_PROPERTIES"
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--build_metadata="$line")
          done <<< "$RBE_BUILD_METADATA"
          [ -n "${{ inputs.nonce }}" ] && args+=(--nonce="${{ inputs.nonce }}")
          set +e
          ./cargo-rbe smoke "${args[@]}" --json-out report.json | tee smoke.log
          rc=${PIPESTATUS[0]}
          {
            echo "### cargo-rbe smoke"
            echo '```'
            grep -E '^(invocation_id|results_url|\[|summary|         invocation page)' smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # Optional: writes small cache entries for the sample workspace into the configured cache.
      - name: Wrapper acceptance test against the configured cache
        if: vars.RBE_RUN_WRAPPER_TEST == 'true'
        run: |
          args=(--remote_instance_name="${{ vars.RBE_INSTANCE_NAME }}")
          [ -n "$RBE_HEADERS" ] && args+=(--remote_header=@env:RBE_HEADERS)
          BIN_DIR="$PWD" scripts/two-checkout-test.sh --remote-cache "${{ vars.RBE_REMOTE_CACHE || vars.RBE_REMOTE_EXECUTOR }}" "${args[@]}" | tee wrapper-test.log
          { echo "### wrapper acceptance test (configured cache)"; echo '```'; grep -E '^(==|PASS|FAIL|  [AB] |  edited)' wrapper-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Optional: needs an executor whose image has a C compiler and the same Rust toolchain.
      - name: Build-script acceptance test against the configured executor
        if: vars.RBE_RUN_BUILD_SCRIPT_TEST == 'true'
        run: |
          args=(--remote_instance_name="${{ vars.RBE_INSTANCE_NAME }}")
          [ -n "$RBE_HEADERS" ] && args+=(--remote_header=@env:RBE_HEADERS)
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--remote_default_exec_properties="$line")
          done <<< "$RBE_EXEC_PROPERTIES"
          BIN_DIR="$PWD" scripts/build-script-test.sh --mode remote --remote-executor "${{ vars.RBE_REMOTE_EXECUTOR }}" --remote-cache "${{ vars.RBE_REMOTE_CACHE || vars.RBE_REMOTE_EXECUTOR }}" "${args[@]}" | tee build-script-test.log
          { echo "### build-script acceptance test (configured executor)"; echo '```'; grep -E '^(==|PASS|FAIL|  [ABC]:|    )' build-script-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Manual runs only: the wrapper on a real project (see scripts/real-project-test.sh).
      - name: Real project against the configured cache
        if: github.event_name == 'workflow_dispatch' && inputs.project_repo != ''
        env:
          CARGO_ARGS: ${{ inputs.project_cargo_args }}
          BUILD_SCRIPTS: ${{ inputs.project_build_scripts }}
          RESULTS_DIR: real-project-out
        run: |
          args=(--remote_cache="${{ vars.RBE_REMOTE_CACHE || vars.RBE_REMOTE_EXECUTOR }}")
          args+=(--remote_executor="${{ vars.RBE_REMOTE_EXECUTOR }}")
          args+=(--remote_instance_name="${{ vars.RBE_INSTANCE_NAME }}")
          [ -n "$RBE_HEADERS" ] && args+=(--remote_header=@env:RBE_HEADERS)
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--remote_default_exec_properties="$line")
          done <<< "$RBE_EXEC_PROPERTIES"
          BIN_DIR="$PWD" scripts/real-project-test.sh "${{ inputs.project_repo }}" "${{ inputs.project_ref }}" "${args[@]}" | tee real-project.log
          { echo "### real project: ${{ inputs.project_repo }} @ ${{ inputs.project_ref }}"; echo '```'; cat real-project-out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.project_repo != ''
        with: { name: real-project, path: real-project-out }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report-remote, path: "report.json\nsmoke.log\nwrapper-test.log" }
