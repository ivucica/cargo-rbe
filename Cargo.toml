[package]
name = "cargo-rbe"
version = "0.0.1"
edition = "2021"
description = "Remote Execution API (REAPI) client experiments for Cargo builds (D1: smoke test)"
publish = false

[lib]
name = "cargo_rbe"
path = "src/lib.rs"
doctest = false # generated protobuf comments contain code blocks

[[bin]]
name = "cargo-rbe"
path = "src/main.rs"

# Used as RUSTC_WRAPPER; `cargo-rbe cargo ...` sets it up automatically.
[[bin]]
name = "cargo-rbe-wrap"
path = "src/wrap_main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.12", features = ["tls", "tls-roots", "tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
members = ["tools/protogen"]
exclude = ["examples/sample-ws"]
